<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>アンケート</title>
  <style>
    :root {
      --amber:        #FF8F00;
      --amber-light:  #FFE082;
      --amber-pale:   #FFF8E1;
      --bg-start:     #FFFDE7;
      --bg-end:       #FFF3E0;
      --text-dark:    #4E342E;
      --text-mid:     #795548;
      --accent:       #E65100;
      --white:        #FFFFFF;
      --shadow:       rgba(0,0,0,0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
                   'Noto Sans JP', 'Meiryo', sans-serif;
      background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── スクリーン共通 ── */
    .screen {
      display: none;
      min-height: 100vh;
      width: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 40px;
    }
    .screen.active { display: flex; }

    /* ── アニメーション ── */
    @keyframes toastInOut {
      0%   { opacity: 0; transform: translateY(12px); }
      15%  { opacity: 1; transform: translateY(0);    }
      75%  { opacity: 1; transform: translateY(0);    }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: #2E7D32;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      padding: 12px 28px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      pointer-events: none;
      animation: toastInOut 2s ease forwards;
      white-space: nowrap;
      z-index: 9999;
    }
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes bounce {
      from { transform: translateY(0);    }
      to   { transform: translateY(-22px); }
    }
    @keyframes pop {
      0%   { transform: scale(1);    }
      40%  { transform: scale(0.93); }
      100% { transform: scale(1);    }
    }
    .anim-fadeup {
      animation: fadeUp 0.32s ease both;
    }

    /* ════════════════════════════
       アンケート画面
    ════════════════════════════ */

    /* 進行ドット */
    .progress-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 36px;
    }
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--amber-light);
      border: 2.5px solid var(--amber);
      transition: background 0.3s, transform 0.3s, border-color 0.3s;
    }
    .dot.done    { background: var(--amber); }
    .dot.current {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.45);
    }

    /* 質問番号 */
    .q-number {
      font-size: 1.05rem;
      color: var(--text-mid);
      font-weight: bold;
      margin-bottom: 14px;
      letter-spacing: 0.06em;
    }

    /* 質問テキスト */
    .q-text {
      font-size: clamp(1.7rem, 5.5vw, 2.3rem);
      color: var(--text-dark);
      text-align: center;
      font-weight: bold;
      line-height: 1.65;
      margin-bottom: 38px;
      max-width: 560px;
    }

    /* 選択肢リスト */
    #choices {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 540px;
    }

    /* 選択肢ボタン */
    .choice-btn {
      display: flex;
      align-items: center;
      background: var(--white);
      border: 3px solid var(--amber-light);
      border-radius: 24px;
      padding: 15px 22px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      box-shadow: 0 4px 14px var(--shadow);
      transition: transform 0.12s ease, background 0.12s ease,
                  border-color 0.12s ease;
    }
    .choice-btn:active {
      transform: scale(0.95);
      background: var(--amber-pale);
      border-color: var(--amber);
      animation: pop 0.25s ease;
    }
    .choice-emoji {
      font-size: 3.4rem;
      line-height: 1;
      flex-shrink: 0;
      margin-right: 18px;
    }
    .choice-label {
      font-size: 1.35rem;
      color: var(--text-dark);
      font-weight: bold;
      line-height: 1.3;
    }

    /* ════════════════════════════
       ありがとう画面
    ════════════════════════════ */
    #thanks-screen {
      background: linear-gradient(160deg, #E8F5E9, #F3E5F5);
      gap: 0;
    }
    .thanks-emoji {
      font-size: clamp(6rem, 20vw, 9rem);
      margin-bottom: 20px;
      animation: bounce 0.9s ease-in-out infinite alternate;
    }
    .thanks-title {
      font-size: clamp(2.8rem, 10vw, 4.2rem);
      color: #4A148C;
      font-weight: bold;
      text-align: center;
    }
    .thanks-sub {
      font-size: 1.35rem;
      color: #7B1FA2;
      margin-top: 14px;
      text-align: center;
      line-height: 1.7;
    }
    .restart-btn {
      margin-top: 52px;
      background: var(--amber);
      color: var(--white);
      border: none;
      border-radius: 24px;
      padding: 20px 52px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(255,143,0,0.45);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .restart-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(255,143,0,0.4);
    }
    /* 管理者リンク（目立たせない） */
    .admin-hint {
      margin-top: 32px;
      font-size: 0.75rem;
      color: #C5CAE9;
      text-decoration: none;
      opacity: 0.6;
    }

    /* ════════════════════════════
       スタート画面
    ════════════════════════════ */
    #start-screen {
      background: linear-gradient(160deg, #fff9e6 0%, #ffe0b2 100%);
      gap: 0;
    }
    .start-emoji {
      font-size: clamp(5rem, 18vw, 8rem);
      margin-bottom: 0.4em;
      animation: bounce 1.6s ease-in-out infinite alternate;
    }
    .start-title {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 900;
      color: #5d3a00;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 0.5em;
    }
    .start-sub {
      font-size: clamp(1.1rem, 3.5vw, 1.6rem);
      color: #7b5200;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 1.8em;
    }
    .start-btn {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      padding: 0.7em 2.2em;
      border-radius: 999px;
      border: none;
      background: #f9a825;
      color: #fff;
      box-shadow: 0 6px 20px rgba(249,168,37,0.45);
      cursor: pointer;
      transition: transform 0.12s;
    }
    .start-btn:active { transform: scale(0.94); }

    /* ════════════════════════════
       管理者画面
    ════════════════════════════ */
    #admin-screen {
      background: #F5F5F5;
      justify-content: flex-start;
      align-items: stretch;
      overflow-y: auto;
      padding: 24px 16px 48px;
    }
    .adm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 6px;
    }
    .adm-title {
      font-size: 1.55rem;
      color: var(--text-dark);
      font-weight: bold;
    }
    .adm-total {
      font-size: 1.05rem;
      color: var(--text-mid);
      margin-bottom: 22px;
    }

    /* カードセクション */
    .card {
      background: var(--white);
      border-radius: 18px;
      padding: 20px 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .card h2 {
      font-size: 1.15rem;
      color: var(--text-dark);
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .card-avg {
      font-size: 0.95rem;
      color: var(--text-mid);
      margin-bottom: 14px;
    }

    /* 棒グラフ行 */
    .stat-row {
      display: flex;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #F0F0F0;
      gap: 8px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-emoji { font-size: 1.55rem; flex-shrink: 0; }
    .stat-label-text {
      font-size: 0.95rem;
      color: var(--text-dark);
      flex: 0 0 auto;
      width: 9rem;
    }
    .stat-bar-wrap {
      flex: 1;
      background: #EEEEEE;
      border-radius: 5px;
      height: 12px;
      overflow: hidden;
    }
    .stat-bar {
      height: 100%;
      background: var(--amber);
      border-radius: 5px;
      transition: width 0.6s ease;
    }
    .stat-count {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent);
      flex: 0 0 3rem;
      text-align: right;
    }

    /* 最近の回答 */
    .resp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #F0F0F0;
      font-size: 0.9rem;
      color: var(--text-mid);
    }
    .resp-row:last-child { border-bottom: none; }
    .resp-emojis { font-size: 1.45rem; letter-spacing: 4px; }

    /* アクションボタン */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }
    .btn {
      padding: 12px 26px;
      border-radius: 16px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
    }
    .btn:active          { transform: scale(0.95); opacity: 0.85; }
    .btn:disabled        { opacity: 0.35; cursor: default; }
    .btn:disabled:active { transform: none; opacity: 1; }
    .btn-amber   { background: var(--amber); color: white; }
    .btn-red     { background: #EF5350;      color: white; }
    .btn-outline {
      background: white;
      color: var(--text-dark);
      border: 2px solid #DDD;
    }

    /* ── 設問編集フォーム ── */
    .edit-q-header  { display: flex; justify-content: space-between; align-items: center;
                      margin-bottom: 6px; }
    .btn-sm         { padding: 5px 12px; font-size: 0.8rem; border-radius: 8px; border: none;
                      cursor: pointer; font-weight: bold; transition: transform 0.12s; }
    .btn-sm:active  { transform: scale(0.95); }
    .btn-sm:disabled { opacity: 0.35; cursor: default; }
    .btn-sm-red     { background: #FFEBEE; color: #C62828; }
    .btn-sm-add     { background: #E8F5E9; color: #2E7D32; }
    .edit-q-block   { margin-bottom: 24px; }
    .edit-q-label   { font-size: 0.9rem; color: var(--text-mid); font-weight: bold;
                      margin-bottom: 6px; }
    .edit-q-text    { width: 100%; min-height: 72px; border: 1.5px solid #DDD;
                      border-radius: 10px; padding: 10px; font-size: 1rem;
                      font-family: inherit; resize: vertical; margin-bottom: 8px; }
    .edit-choice-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .edit-choice-emoji { font-size: 1.6rem; flex-shrink: 0; }
    .edit-choice-label { flex: 1; border: 1.5px solid #DDD; border-radius: 8px;
                         padding: 8px 12px; font-size: 0.95rem; font-family: inherit; }
    .edit-q-text:focus, .edit-choice-label:focus {
      outline: none; border-color: var(--amber);
    }
  </style>
</head>
<body>

  <!-- ════════ スタート画面 ════════ -->
  <div id="start-screen" class="screen active">
    <div class="start-emoji">📋</div>
    <h1 class="start-title">アンケートに<br>こたえよう！</h1>
    <p class="start-sub">みんなのきもちを<br>おしえてください 😊</p>
    <button class="start-btn" id="start-btn">はじめる</button>
  </div>

  <!-- ════════ アンケート画面 ════════ -->
  <div id="survey-screen" class="screen">
    <div class="progress-bar" id="progress-bar"></div>
    <div id="question-content" class="anim-fadeup">
      <div class="q-number" id="q-number"></div>
      <div class="q-text"   id="q-text"></div>
      <div id="choices"></div>
    </div>
  </div>

  <!-- ════════ ありがとう画面 ════════ -->
  <div id="thanks-screen" class="screen">
    <div class="thanks-emoji">🎉</div>
    <div class="thanks-title">ありがとう！</div>
    <div class="thanks-sub">こたえてくれて<br>ありがとうございました</div>
    <button class="restart-btn" onclick="restart()">もういちど</button>
    <a class="admin-hint" href="?admin">管理</a>
  </div>

  <!-- ════════ 管理者画面 ════════ -->
  <div id="admin-screen" class="screen">
    <div id="adm-content"></div>
  </div>

  <script>
    // ─────────────────────────────────────────
    // 定数（デフォルト値）
    // ─────────────────────────────────────────
    const QUESTIONS_DEFAULT = [
      'きょうのかつどうは\nたのしかったですか？',
      'またいきたいですか？',
      'きょうは\nつかれましたか？',
    ];

    // score: 5=最高 … 1=最低（配列インデックス 0 が score 5）
    // 質問ごとの選択肢（QUESTIONS と同じ順番）
    const CHOICES_DEFAULT = [
      // Q1: きょうのかつどうは たのしかったですか？
      [
        { emoji: '😄', label: 'すごくたのしい',        score: 5 },
        { emoji: '🙂', label: 'たのしい',              score: 4 },
        { emoji: '😐', label: 'ふつう',                score: 3 },
        { emoji: '🙁', label: 'あまりたのしくなかった', score: 2 },
        { emoji: '😢', label: 'たのしくなかった',       score: 1 },
      ],
      // Q2: またいきたいですか？
      [
        { emoji: '😄', label: 'ぜったいいきたい',   score: 5 },
        { emoji: '🙂', label: 'いきたい',           score: 4 },
        { emoji: '😐', label: 'ふつう',             score: 3 },
        { emoji: '🙁', label: 'あまりいきたくない', score: 2 },
        { emoji: '😢', label: 'いきたくない',       score: 1 },
      ],
      // Q3: きょうは つかれましたか？
      [
        { emoji: '😄', label: 'ぜんぜんつかれていない', score: 5 },
        { emoji: '🙂', label: 'あまりつかれていない',   score: 4 },
        { emoji: '😐', label: 'ふつう',                 score: 3 },
        { emoji: '🙁', label: 'すこしつかれた',         score: 2 },
        { emoji: '😢', label: 'すごくつかれた',         score: 1 },
      ],
    ];

    // カスタマイズ可能な設問・選択肢（起動時に localStorage から上書き）
    let QUESTIONS = QUESTIONS_DEFAULT.slice();
    let CHOICES   = CHOICES_DEFAULT.map(q => q.map(c => ({ ...c })));

    const STORAGE_KEY = 'nichiyo_survey_results'; // マイグレーション用（旧キー）
    const CONFIG_KEY  = 'nichiyo_survey_config';  // マイグレーション用（旧キー）
    const SURVEYS_KEY = 'nichiyo_surveys';
    const ACTIVE_KEY  = 'nichiyo_active_survey';

    // ─────────────────────────────────────────
    // 状態
    // ─────────────────────────────────────────
    let currentQ   = 0;
    let answers    = [];   // 各質問のスコア (1–5)
    let busy       = false; // 二重タップ防止

    let surveys        = [];      // アンケート配列
    let activeSurveyId = null;    // 表示中アンケートID
    let editingSurveyId = null;   // 詳細ビューで開いているアンケートID
    let adminView      = 'list';  // 'list' | 'detail'

    // ─────────────────────────────────────────
    // ストレージ（複数アンケート）
    // ─────────────────────────────────────────
    function loadSurveys() {
      try {
        const raw = localStorage.getItem(SURVEYS_KEY);
        if (raw) {
          surveys = JSON.parse(raw);
        } else {
          // マイグレーション：旧データを「アンケート 1」として取り込む
          const firstSurvey = {
            id:        String(Date.now()),
            name:      'アンケート 1',
            createdAt: new Date().toISOString(),
            questions: QUESTIONS_DEFAULT.slice(),
            choices:   CHOICES_DEFAULT.map(q => q.map(c => ({ ...c }))),
            results:   [],
          };
          const oldConfig = localStorage.getItem(CONFIG_KEY);
          if (oldConfig) {
            try {
              const cfg = JSON.parse(oldConfig);
              if (Array.isArray(cfg.questions)) firstSurvey.questions = cfg.questions;
              if (Array.isArray(cfg.choices))   firstSurvey.choices   = cfg.choices;
            } catch {}
          }
          const oldResults = localStorage.getItem(STORAGE_KEY);
          if (oldResults) {
            try {
              const res = JSON.parse(oldResults);
              if (Array.isArray(res)) firstSurvey.results = res;
            } catch {}
          }
          surveys = [firstSurvey];
          saveSurveys();
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(CONFIG_KEY);
        }
      } catch {
        surveys = [];
      }
      // 表示中アンケートIDの解決
      activeSurveyId = localStorage.getItem(ACTIVE_KEY);
      if (!surveys.find(s => s.id === activeSurveyId)) {
        activeSurveyId = surveys[0]?.id ?? null;
        if (activeSurveyId) localStorage.setItem(ACTIVE_KEY, activeSurveyId);
      }
    }

    function saveSurveys() {
      try { localStorage.setItem(SURVEYS_KEY, JSON.stringify(surveys)); } catch {}
    }

    function getActiveSurvey()  { return surveys.find(s => s.id === activeSurveyId) ?? null; }
    function getEditingSurvey() { return surveys.find(s => s.id === editingSurveyId) ?? null; }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function createSurvey(name) {
      const survey = {
        id:        String(Date.now()),
        name:      name,
        createdAt: new Date().toISOString(),
        questions: QUESTIONS_DEFAULT.slice(),
        choices:   CHOICES_DEFAULT.map(q => q.map(c => ({ ...c }))),
        results:   [],
      };
      surveys.push(survey);
      saveSurveys();
      return survey;
    }

    function setActiveSurvey(id) {
      activeSurveyId = id;
      localStorage.setItem(ACTIVE_KEY, id);
    }

    // 表示中アンケートの設問・選択肢をグローバル変数に展開
    function loadConfig() {
      const s = getActiveSurvey();
      if (s) {
        QUESTIONS = s.questions.slice();
        CHOICES   = s.choices.map(q => q.map(c => ({ ...c })));
      } else {
        QUESTIONS = QUESTIONS_DEFAULT.slice();
        CHOICES   = CHOICES_DEFAULT.map(q => q.map(c => ({ ...c })));
      }
    }

    // 選択肢の絵文字・スコアを位置に応じて自動再割り当て
    const EMOJI_PALETTE = ['😄', '🙂', '😐', '🙁', '😢'];
    function reassignChoices(qi) {
      const n = CHOICES[qi].length;
      CHOICES[qi].forEach((c, i) => {
        c.score = n - i;
        const ei = n === 1 ? 2 : Math.round(i / (n - 1) * (EMOJI_PALETTE.length - 1));
        c.emoji = EMOJI_PALETTE[ei];
      });
    }

    // 編集フォームの現在値を QUESTIONS/CHOICES に収集
    function collectFormValues() {
      document.querySelectorAll('.edit-q-text').forEach(el => {
        QUESTIONS[+el.dataset.qi] = el.value;
      });
      document.querySelectorAll('.edit-choice-label').forEach(el => {
        CHOICES[+el.dataset.qi][+el.dataset.ci].label = el.value;
      });
    }

    // ─────────────────────────────────────────
    // 初期化
    // ─────────────────────────────────────────
    function init() {
      loadSurveys();
      loadConfig();
      if (location.search.includes('admin')) {
        adminView = 'list';
        editingSurveyId = null;
        showScreen('admin-screen');
        renderAdmin();
      } else {
        showScreen('start-screen');
      }
      document.getElementById('start-btn').addEventListener('click', function() {
        loadConfig();
        showScreen('survey-screen');
        renderQuestion(0);
      });
    }

    // ─────────────────────────────────────────
    // アンケート
    // ─────────────────────────────────────────
    function renderQuestion(idx) {
      currentQ = idx;

      // 進行ドット生成（初回のみ）
      const bar = document.getElementById('progress-bar');
      if (bar.children.length !== QUESTIONS.length) {
        bar.innerHTML = '';
        QUESTIONS.forEach((_, i) => {
          const d = document.createElement('div');
          d.className = 'dot';
          bar.appendChild(d);
        });
      }
      bar.querySelectorAll('.dot').forEach((d, i) => {
        d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' current' : '');
      });

      // 質問番号
      document.getElementById('q-number').textContent =
        `しつもん ${idx + 1} / ${QUESTIONS.length}`;

      // 質問テキスト
      document.getElementById('q-text').innerHTML =
        QUESTIONS[idx].replace('\n', '<br>');

      // 選択肢ボタン
      const choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = '';
      CHOICES[idx].forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerHTML =
          `<span class="choice-emoji">${ch.emoji}</span>` +
          `<span class="choice-label">${ch.label}</span>`;
        btn.addEventListener('click', () => onChoose(ch.score));
        choicesEl.appendChild(btn);
      });

      // フェードアニメーション
      const content = document.getElementById('question-content');
      content.style.animation = 'none';
      // reflow を強制してアニメーションをリセット
      void content.offsetHeight;
      content.style.animation = 'fadeUp 0.32s ease both';
    }

    function onChoose(score) {
      if (busy) return;
      busy = true;

      answers.push(score);

      setTimeout(() => {
        if (currentQ < QUESTIONS.length - 1) {
          renderQuestion(currentQ + 1);
          busy = false;
        } else {
          saveResult();
          showScreen('thanks-screen');
          busy = false;
        }
      }, 220);
    }

    function restart() {
      answers = [];
      showScreen('start-screen');
    }

    function backToSurvey() {
      answers = [];
      history.replaceState({}, '', location.pathname);
      showScreen('start-screen');
    }

    function saveResult() {
      const s = getActiveSurvey();
      if (!s) return;
      const result = { date: new Date().toISOString() };
      answers.forEach((score, i) => { result[`q${i + 1}`] = score; });
      s.results.push(result);
      saveSurveys();
    }

    // ─────────────────────────────────────────
    // 管理者画面
    // ─────────────────────────────────────────
    function renderAdmin() {
      document.getElementById('adm-content').innerHTML =
        adminView === 'list' ? renderSurveyList() : renderSurveyDetail();
    }

    // ── ビュー A：アンケート一覧 ──
    function renderSurveyList() {
      let html = `
        <div class="adm-header">
          <div class="adm-title">📋 アンケート一覧</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <button class="btn btn-amber" onclick="onCreateSurvey()">＋ 新しいアンケート</button>
            <button class="btn btn-outline" onclick="backToSurvey()">← アンケートへ</button>
          </div>
        </div>`;

      if (surveys.length === 0) {
        return html + `<div class="card"><p style="color:var(--text-mid)">アンケートがありません。</p></div>`;
      }

      surveys.forEach(s => {
        const isActive = s.id === activeSurveyId;
        const d = new Date(s.createdAt);
        const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
        html += `
          <div class="card" style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <span style="font-size:1.1rem;font-weight:bold;color:var(--text-dark);flex:1">${escHtml(s.name)}</span>
              ${isActive
                ? `<span style="background:#E8F5E9;color:#2E7D32;padding:4px 12px;border-radius:999px;font-size:0.85rem;font-weight:bold;">▶ 表示中</span>`
                : `<button class="btn btn-outline" style="padding:6px 14px;font-size:0.85rem" onclick="onSetActive('${s.id}')">つかう</button>`
              }
            </div>
            <div style="font-size:0.9rem;color:var(--text-mid);">
              ${s.results.length} 件の回答 ・ 作成日 ${dateStr}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-outline" style="padding:8px 18px;font-size:0.9rem"
                      onclick="onOpenDetail('${s.id}')">詳細 →</button>
              <button class="btn btn-red" style="padding:8px 18px;font-size:0.9rem"
                      onclick="onDeleteSurvey('${s.id}')"
                      ${isActive ? 'disabled' : ''}>削除</button>
            </div>
          </div>`;
      });

      return html;
    }

    // ── ビュー B：アンケート詳細（結果＋設問編集） ──
    function renderSurveyDetail() {
      const s = getEditingSurvey();
      if (!s) { adminView = 'list'; return renderSurveyList(); }

      // グローバルを編集中アンケートに同期
      QUESTIONS = s.questions.slice();
      CHOICES   = s.choices.map(q => q.map(c => ({ ...c })));

      const results = s.results;
      let html = `
        <div class="adm-header">
          <div class="adm-title">📝 ${escHtml(s.name)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-outline" onclick="onBackToList()">← 一覧へ</button>
            <button class="btn btn-outline" onclick="backToSurvey()">← アンケートへ</button>
          </div>
        </div>`;

      if (results.length === 0) {
        html += `<div class="card"><p style="color:var(--text-mid);font-size:1.1rem;">まだ回答がありません。</p></div>`;
      } else {
        html += `<div class="adm-total">かいとうすう：<strong>${results.length} 件</strong></div>`;

        // ── 質問ごとの集計 ──
        QUESTIONS.forEach((q, qi) => {
          const key = `q${qi + 1}`;
          const n = CHOICES[qi].length;
          const counts = Array(n).fill(0);
          let total = 0;
          results.forEach(r => {
            const sc = r[key];
            if (sc >= 1 && sc <= n) { counts[sc - 1]++; total += sc; }
          });
          const avg = (total / results.length).toFixed(1);
          const maxCount = Math.max(...counts, 1);

          html += `<div class="card">`;
          html += `<h2>Q${qi + 1}. ${q.replace('\n', ' ')}</h2>`;
          html += `<div class="card-avg">へいきん: ${avg} / ${n}.0</div>`;

          CHOICES[qi].forEach(c => {
            const count = counts[c.score - 1];
            const pct   = Math.round((count / maxCount) * 100);
            html += `
              <div class="stat-row">
                <span class="stat-emoji">${c.emoji}</span>
                <span class="stat-label-text">${c.label}</span>
                <div class="stat-bar-wrap">
                  <div class="stat-bar" style="width:${pct}%"></div>
                </div>
                <span class="stat-count">${count}件</span>
              </div>`;
          });

          html += `</div>`;
        });

        // ── 最近の回答（新しい順・最大30件）──
        html += `<div class="card"><h2>さいきんのかいとう</h2>`;
        results.slice(-30).reverse().forEach(r => {
          const d = new Date(r.date);
          const ds =
            `${d.getMonth()+1}/${d.getDate()} ` +
            `${String(d.getHours()).padStart(2,'0')}:` +
            `${String(d.getMinutes()).padStart(2,'0')}`;
          const emojis = QUESTIONS.map((_, qi) => {
            const sc = r[`q${qi + 1}`];
            const nc = CHOICES[qi].length;
            return (sc >= 1 && sc <= nc) ? CHOICES[qi][nc - sc].emoji : '?';
          }).join(' ');
          html += `
            <div class="resp-row">
              <span>${ds}</span>
              <span class="resp-emojis">${emojis}</span>
            </div>`;
        });
        html += `</div>`;
      }

      // ── 設問編集 ──
      html += `<div class="card"><h2>✏️ 設問を編集</h2>`;
      QUESTIONS.forEach((q, qi) => {
        const canDeleteQ = QUESTIONS.length > 1;
        html += `<div class="edit-q-block">`;
        html += `<div class="edit-q-header">
          <div class="edit-q-label">Q${qi + 1} 設問テキスト</div>
          <button class="btn-sm btn-sm-red" onclick="removeQuestion(${qi})"
                  ${canDeleteQ ? '' : 'disabled'}>× 削除</button>
        </div>`;
        html += `<textarea class="edit-q-text" data-qi="${qi}">${escHtml(q)}</textarea>`;
        const canDeleteC = CHOICES[qi].length > 2;
        CHOICES[qi].forEach((c, ci) => {
          html += `
            <div class="edit-choice-row">
              <span class="edit-choice-emoji">${c.emoji}</span>
              <input class="edit-choice-label" data-qi="${qi}" data-ci="${ci}"
                     value="${escHtml(c.label)}">
              <button class="btn-sm btn-sm-red" onclick="removeChoice(${qi},${ci})"
                      ${canDeleteC ? '' : 'disabled'}>×</button>
            </div>`;
        });
        html += `<button class="btn-sm btn-sm-add" onclick="addChoice(${qi})" style="margin-top:6px">＋ 選択肢を追加</button>`;
        html += `</div>`;
      });
      html += `<button class="btn-sm btn-sm-add" onclick="addQuestion()" style="margin-bottom:14px">＋ 設問を追加</button>`;
      html += `
        <div class="btn-row">
          <button class="btn btn-amber"   onclick="applyConfig()">💾 保存する</button>
          <button class="btn btn-outline" onclick="cancelConfig()">キャンセル</button>
        </div>
      </div>`;

      // ── アクションボタン ──
      html += `
        <div class="btn-row">
          <button class="btn btn-amber"   onclick="exportCSV()">CSVでだす</button>
          <button class="btn btn-red"     onclick="clearData()">データをけす</button>
        </div>
        <div style="height:32px"></div>`;

      return html;
    }

    function addQuestion() {
      collectFormValues();
      QUESTIONS.push('あたらしいせつもん');
      CHOICES.push(CHOICES_DEFAULT[0].map(c => ({ ...c })));
      syncEditingSurvey();
      renderAdmin();
    }

    function removeQuestion(qi) {
      if (QUESTIONS.length <= 1) return;
      if (!confirm(`Q${qi + 1} を削除しますか？\n保存済みの回答データとの対応がずれる場合があります。`)) return;
      collectFormValues();
      QUESTIONS.splice(qi, 1);
      CHOICES.splice(qi, 1);
      syncEditingSurvey();
      renderAdmin();
    }

    function addChoice(qi) {
      collectFormValues();
      CHOICES[qi].push({ emoji: '😢', label: 'あたらしいせんたくし', score: 1 });
      reassignChoices(qi);
      syncEditingSurvey();
      renderAdmin();
    }

    function removeChoice(qi, ci) {
      if (CHOICES[qi].length <= 2) return;
      collectFormValues();
      CHOICES[qi].splice(ci, 1);
      reassignChoices(qi);
      syncEditingSurvey();
      renderAdmin();
    }

    // 編集中の QUESTIONS/CHOICES をアンケートオブジェクトへ書き戻す（未保存・一時同期）
    function syncEditingSurvey() {
      const s = getEditingSurvey();
      if (s) {
        s.questions = QUESTIONS.slice();
        s.choices   = CHOICES.map(q => q.map(c => ({ ...c })));
      }
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      t.addEventListener('animationend', () => t.remove());
    }

    function applyConfig() {
      collectFormValues();
      QUESTIONS.forEach((q, qi) => {
        if (!q.trim()) QUESTIONS[qi] = QUESTIONS_DEFAULT[qi] || 'せつもん';
        CHOICES[qi].forEach((c, ci) => {
          if (!c.label.trim()) c.label = CHOICES_DEFAULT[qi]?.[ci]?.label || 'せんたくし';
        });
        reassignChoices(qi);
      });
      const s = getEditingSurvey();
      if (s) {
        s.questions = QUESTIONS.slice();
        s.choices   = CHOICES.map(q => q.map(c => ({ ...c })));
        if (s.id === activeSurveyId) loadConfig();
      }
      saveSurveys();
      renderAdmin();
      showToast('✅ 保存しました！');
    }

    function cancelConfig() {
      const s = getEditingSurvey();
      if (s) {
        QUESTIONS = s.questions.slice();
        CHOICES   = s.choices.map(q => q.map(c => ({ ...c })));
      }
      renderAdmin();
    }

    function exportCSV() {
      const s = getEditingSurvey();
      if (!s || s.results.length === 0) { alert('データがありません。'); return; }

      const results   = s.results;
      const questions = s.questions;
      const choices   = s.choices;
      const scoreToLabel = (score, qi) => {
        const nc = choices[qi].length;
        return (score >= 1 && score <= nc) ? choices[qi][nc - score].label : '';
      };
      const BOM = '\uFEFF';
      const header = '日時,' +
        questions.map((_, qi) => `Q${qi + 1}スコア,Q${qi + 1}回答`).join(',') + '\n';
      const rows = results.map(r =>
        `"${new Date(r.date).toLocaleString('ja-JP')}"` +
        questions.map((_, qi) => {
          const score = r[`q${qi + 1}`];
          return `,${ score ?? ''},"${scoreToLabel(score, qi)}"`;
        }).join('')
      ).join('\n');

      const blob = new Blob([BOM + header + rows], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `survey_${s.name.replace(/\s/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearData() {
      if (confirm('このアンケートのすべての回答データを削除しますか？\nこの操作は元に戻せません。')) {
        const s = getEditingSurvey();
        if (s) { s.results = []; saveSurveys(); }
        renderAdmin();
      }
    }

    // ─────────────────────────────────────────
    // 一覧操作ハンドラ
    // ─────────────────────────────────────────
    function onCreateSurvey() {
      const name = prompt('アンケート名を入力してください', `アンケート ${surveys.length + 1}`);
      if (name === null) return;
      createSurvey(name.trim() || `アンケート ${surveys.length + 1}`);
      renderAdmin();
      showToast('✅ アンケートを作成しました！');
    }

    function onSetActive(id) {
      setActiveSurvey(id);
      loadConfig();
      renderAdmin();
      showToast('✅ アンケートを切り替えました！');
    }

    function onOpenDetail(id) {
      editingSurveyId = id;
      adminView = 'detail';
      renderAdmin();
    }

    function onBackToList() {
      editingSurveyId = null;
      adminView = 'list';
      renderAdmin();
    }

    function onDeleteSurvey(id) {
      if (id === activeSurveyId) { alert('表示中のアンケートは削除できません。'); return; }
      const survey = surveys.find(s => s.id === id);
      if (!survey) return;
      if (!confirm(`「${survey.name}」を削除しますか？\nこの操作は元に戻せません。`)) return;
      surveys = surveys.filter(s => s.id !== id);
      saveSurveys();
      renderAdmin();
      showToast('🗑 削除しました');
    }

    // ─────────────────────────────────────────
    // ユーティリティ
    // ─────────────────────────────────────────
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ─────────────────────────────────────────
    // 起動
    // ─────────────────────────────────────────
    init();
  </script>
</body>
</html>
